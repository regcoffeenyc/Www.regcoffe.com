<!doctype html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>GeoTactical Market — ადმინისტრირება</title>
<style>
:root{--bg:#14170f;--panel:#1e2318;--panel2:#232a1c;--line:#2c3126;--line2:#363c2e;--ink:#e9e7dc;--ink2:#f2f0e6;--muted:#a9ae9d;--dim:#8d947f;--red:#c8102e;--red2:#a30d25;--green:#5ecb7d;--gold:#f4a83d;--blue:#6db3ea;
--body:"Noto Sans Georgian","DejaVu Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
button{font-family:var(--body);cursor:pointer}
input,select,textarea{font-family:var(--body);background:var(--bg);border:1px solid var(--line2);color:var(--ink);padding:8px 10px;font-size:.9rem;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px}
a{color:var(--blue)}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:7px 14px;font-size:.84rem;font-weight:600}
.btn:hover{border-color:var(--dim)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.red:hover{background:var(--red2)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.78rem}
.tag{display:inline-block;padding:2px 8px;font-size:.72rem;font-weight:700;letter-spacing:.03em;border:1px solid var(--line2);color:var(--muted)}
.tag.green{color:#0d1108;background:var(--green);border-color:var(--green)}
.tag.red{color:#fff;background:var(--red);border-color:var(--red)}
.tag.gold{color:#1a1405;background:var(--gold);border-color:var(--gold)}
.tag.blue{color:#0a1520;background:var(--blue);border-color:var(--blue)}
.tag.dim{color:var(--dim)}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line2);padding:30px}
.login-card h1{font-size:1.35rem;color:var(--ink2);line-height:1.25;margin-bottom:4px}
.login-card .sub{color:var(--muted);font-size:.86rem;margin-bottom:18px}
.login-card label{display:block;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.login-card .err{color:#f06a7c;font-size:.82rem;min-height:1.2em;margin-top:8px}
.login-card .note{margin-top:14px;font-size:.72rem;color:var(--dim)}
.brandline{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brandline .dot{width:12px;height:12px;background:var(--red)}
.brandline span{font-weight:800;letter-spacing:.14em;font-size:.8rem;color:var(--ink2)}
/* layout */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:#11140c;border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brandline{padding:0 18px}
.side nav{margin-top:12px}
.side nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:10px 18px;font-size:.9rem;font-weight:600;border-left:3px solid transparent}
.side nav button:hover{color:var(--ink)}
.side nav button.on{color:var(--ink2);background:var(--panel);border-left-color:var(--red)}
.side nav .cnt{font-size:.7rem;background:var(--red);color:#fff;padding:1px 7px;font-weight:800}
.side .foot{padding:16px 18px;color:var(--dim);font-size:.72rem}
.main{padding:22px 26px;min-width:0}
.tophead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.tophead h2{font-size:1.35rem;color:var(--ink2)}
.tophead .who{color:var(--muted);font-size:.84rem;display:flex;gap:10px;align-items:center}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px}
.card .k{font-size:1.7rem;font-weight:800;color:var(--ink2)}
.card .k.warn{color:var(--gold)}
.card .k.bad{color:#f06a7c}
.card .t{color:var(--muted);font-size:.8rem;margin-top:2px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line)}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel .ph h3{font-size:.95rem;color:var(--ink2)}
.panel .pb{padding:14px 16px}
/* agents grid */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.agent{background:var(--panel);border:1px solid var(--line);padding:14px;cursor:pointer}
.agent:hover{border-color:var(--dim)}
.agent .an{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink2);font-size:.92rem}
.agent .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pu 2s infinite}
@keyframes pu{50%{opacity:.35}}
.agent .ad{color:var(--muted);font-size:.78rem;margin-top:6px}
.agent .am{margin-top:8px;font-size:.78rem;color:var(--gold);font-weight:700}
/* tables */
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{color:var(--dim);text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line2)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#20261a}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{width:auto;min-width:150px}
.rowact{display:flex;gap:6px;flex-wrap:wrap}
.feed{list-style:none}
.feed li{padding:9px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.feed li:last-child{border:0}
.feed time{color:var(--dim);font-size:.72rem;display:block}
.empty{color:var(--dim);padding:18px 6px;font-size:.88rem}
/* detail split */
.split{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.msg-list{max-height:540px;overflow-y:auto}
.msg{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.msg:hover,.msg.on{background:var(--panel2)}
.msg .s{display:flex;justify-content:space-between;gap:8px;font-weight:700;color:var(--ink2);font-size:.86rem}
.msg .p{color:var(--muted);font-size:.78rem;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.84rem;margin-bottom:10px}
.kv dt{color:var(--dim)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:.86rem}
.chk input{width:auto;margin-top:3px}
form .fl{display:block;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.frow{grid-template-columns:1fr}}
.toast{position:fixed;bottom:18px;right:18px;z-index:400;background:var(--panel2);border:1px solid var(--green);color:var(--ink2);padding:12px 18px;font-size:.88rem;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hashrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hashrow span{font-size:.76rem;color:var(--blue)}
</style>

/* ---------- persistent stores (seed on first run) ---------- */
function store(key, seed){
  var v = LS.get('gtm-admin-'+key, null);
  if (v === null) { v = seed; LS.set('gtm-admin-'+key, v); }
  return v;
}
var db = {
  listings: store('listings', SEED.listings),
  listingStatus: store('listing-status', {}),      // id -> pending|approved|rejected
  orders: store('orders', SEED.orders),
  catalog: store('catalog', SEED.catalog),
  userFlags: store('user-flags', {}),              // email -> {verified,blocked}
  seedUsers: store('seed-users', SEED.users),
  messages: store('messages', SEED.messages),
  compliance: store('compliance', SEED.compliance),
  drafts: store('drafts', SEED.drafts),
  mentions: store('mentions', SEED.mentions),
  social: store('social', SEED.social),
  prChecks: store('pr-checks', {}),
  activity: store('activity', SEED.activity),
  auth: store('auth', {user:'admin', p: btoa('tactical2026')})
};
function save(k){ LS.set('gtm-admin-'+({listingStatus:'listing-status',userFlags:'user-flags',seedUsers:'seed-users',prChecks:'pr-checks'}[k]||k), db[k]); }
function log(x){ db.activity.unshift({t:new Date().toISOString(), x:x}); db.activity=db.activity.slice(0,40); save('activity'); }

/* backend bridge: live data over /api/gtm when a database is attached */
var API = { on:false };
var live = { users:[], listings:[], orders:[], messages:[] };
function apiKey(){ try{ return atob(db.auth.p); }catch(e){ return ''; } }
function api(a, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json','x-admin-key':apiKey()}, opts.headers||{});
  return fetch('/api/gtm?a='+a, opts).then(function(r){ return r.json(); });
}
function refreshLive(){
  if(!API.on) return Promise.resolve();
  return Promise.all([api('users'),api('listings'),api('orders'),api('messages')]).then(function(r){
    live.users   = Array.isArray(r[0]) ? r[0] : [];
    live.listings= Array.isArray(r[1]) ? r[1] : [];
    live.orders  = Array.isArray(r[2]) ? r[2] : [];
    live.messages= Array.isArray(r[3]) ? r[3] : [];
  }).catch(function(e){});
}
fetch('/api/gtm?a=health').then(function(r){return r.json();}).then(function(h){
  if(h && h.connected){ API.on = true; refreshLive().then(function(){ render(); }); }
}).catch(function(e){});

function ordersAll(){
  return live.orders.map(function(o){ o=Object.assign({},o); o.live=true; return o; }).concat(db.orders);
}
function msgsAll(){
  return live.messages.map(function(m){ m=Object.assign({},m); m.live=true; return m; }).concat(db.messages);
}

/* shop integration: users registered on the storefront + listings posted there */
function shopUsers(){
  var u = LS.get('gtm-users', {});
  return Object.keys(u).map(function(em){ return {email:em, name:u[em].name, phone:u[em].phone||'—', source:'საიტიდან', created:''}; });
}
function shopListings(){
  var arr = LS.get('ironfield-listings', []);
  return (Array.isArray(arr)?arr:[]).map(function(l){
    return {id:'shop-'+(l.id||id()), name:l.name||l.title||'უსახელო განცხადება', seller:l.seller||l.contactName||'საიტის მომხმარებელი',
            price:+l.price||0, cat:l.category||'—', cond:l.condition||'—', regulated:!!l.regulated, created:l.createdAt||new Date().toISOString()};
  });

    if(pf.p1.value.length<8) return toast('პაროლი ძალიან მოკლეა');
    if(pf.p1.value!==pf.p2.value) return toast('პაროლები არ ემთხვევა');
    db.auth.p=btoa(pf.p1.value); save('auth'); toast('პაროლი შეცვლილია'); pf.reset();
  });
  var rd=app.querySelector('#reset-data');
  if(rd) rd.addEventListener('click',function(){
    ['listings','listing-status','orders','catalog','user-flags','seed-users','messages','compliance','drafts','activity'].forEach(function(k){ localStorage.removeItem('gtm-admin-'+k); });
    location.reload();
  });
}

render();
})();
</script>
</body>
</html>
