    <div id="root"></div>
  
<style>
/* GeoTactical Market enhancements: OpticsPlanet-style product list & search, view toggle, price filter */

/* ---- product tiles, styled after leading US tactical retailers (OpticsPlanet) ---- */
.if-brand{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:#8d947f;font-weight:700;margin-bottom:2px}
.product-info h3 .product-title-button{color:#f2f0e6;font-weight:700}
.product-info h3 .product-title-button:hover{text-decoration:underline;color:#fff}
.rating svg{color:#f4a83d;fill:#f4a83d}
.rating{color:#d7d5c9}
.rating span{color:#a9ae9d}
.product-bottom{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.product-bottom strong{color:#fff;font-size:1.28rem;letter-spacing:0}
.if-stock{display:flex;align-items:center;gap:5px;color:#5ecb7d;font-size:.79rem;font-weight:700}
.if-stock svg{flex:none}
.if-ship{color:#a9ae9d;font-size:.74rem;font-weight:600}
.quick-add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#c8102e;border:1px solid #c8102e;color:#fff;padding:10px 12px;margin-top:7px;font-family:var(--body);font-weight:800;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:background .15s}
.quick-add:hover{background:#a30d25;border-color:#a30d25;color:#fff}
.product-badge{background:#c8102e;color:#fff;font-weight:700}

/* ---- view toggle (grid/list switch) ---- */
.if-view-toggle{display:flex;gap:0;border:1px solid var(--line);background:#1e2318}
.if-view-toggle button{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s}
.if-view-toggle button.active{background:#c8102e;color:#fff}
.if-view-toggle button:not(.active):hover{color:var(--ink)}

/* ---- list view: OpticsPlanet-style horizontal result rows ---- */
@media (min-width:721px){
  .product-grid.if-list{display:flex;flex-direction:column;gap:12px}
  .product-grid.if-list .product-card{display:grid;grid-template-columns:240px minmax(0,1fr);align-items:stretch}
  .product-grid.if-list .product-image{height:100%;min-height:200px}
  .product-grid.if-list .product-image img{height:100%;object-fit:cover}
  .product-grid.if-list .product-info{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:18px 22px}
  .product-grid.if-list .product-info h3{font-size:1.14rem}
  .product-grid.if-list .product-bottom{margin-top:4px;border-top:1px solid #2c3126;padding-top:10px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 16px}
  .product-grid.if-list .product-bottom strong{font-size:1.42rem;margin-right:auto}
  .product-grid.if-list .quick-add{width:auto;min-width:220px;margin-top:0}
}

/* ---- search autocomplete (OpticsPlanet-style suggest with thumbnails & prices) ---- */
.if-ac-host{position:relative}
.if-ac{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:120;background:#1e2318;border:1px solid #363c2e;box-shadow:0 14px 34px rgba(0,0,0,.5);max-height:420px;overflow-y:auto}
.if-ac[hidden]{display:none}
.if-ac-head{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#8d947f;font-weight:800;padding:10px 14px 4px;border-top:1px solid #2a2f23}
.if-ac-head:first-child{border-top:0}
.if-ac-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 14px;cursor:pointer;color:var(--ink);font-family:var(--body);font-size:.9rem}
.if-ac-item svg{flex:none;color:var(--muted)}
.if-ac-item.sel,.if-ac-item:hover{background:#2a3122}
.if-ac-item b{color:#f06a7c}
.if-ac-thumb{flex:none;width:40px;height:40px;object-fit:cover;border:1px solid #363c2e;background:#14170f}
.if-ac-price{margin-left:auto;flex:none;color:#fff;font-weight:800;font-size:.88rem}
.if-ac-tag{margin-left:auto;flex:none;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:#8d947f;border:1px solid var(--line);padding:2px 7px}

/* ---- price range filter ---- */
.if-price fieldset{border:0;margin:0;padding:0}
.if-price legend{font-family:var(--display);font-size:1.02rem;font-weight:700;margin-bottom:12px;padding:0}
.if-price-row{display:flex;align-items:center;gap:8px}
.if-price-row input{width:100%;min-width:0;border:1px solid var(--line);background:#14170f;padding:9px 10px;font-family:var(--body);font-size:.9rem;color:var(--ink)}
.if-price-row input:focus{outline:2px solid var(--olive);outline-offset:-1px}
.if-price-row span{color:var(--muted);flex:none}
.if-price-apply{margin-top:10px;width:100%;border:1px solid #c8102e;background:#c8102e;color:#fff;padding:9px 12px;font-family:var(--body);font-weight:600;font-size:.88rem;cursor:pointer;transition:all .18s}
.if-price-apply:hover{background:#a30d25}
.if-price-clear{margin-top:8px;width:100%;border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 12px;font-size:.82rem;cursor:pointer}
.if-price-clear:hover{color:var(--ink);border-color:var(--ink)}
.if-price-note{margin-top:9px;font-size:.8rem;color:#e9e7dc}
.if-empty{padding:34px 8px;color:var(--muted);font-size:.95rem}

/* ---- Georgian text fixes: line-height crush + layout overlaps ---- */
h1,h2,h3{line-height:1.14!important}
.hero-proof{position:static!important;margin-top:26px}
.product-image:has(.regulated-overlay) .condition-badge{bottom:44px!important}

/* ---- account / auth (5.11-style) ---- */
.gtm-auth-backdrop{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:18px}
.gtm-auth{width:min(430px,100%);background:#1e2318;border:1px solid #363c2e;box-shadow:0 26px 60px rgba(0,0,0,.6);padding:26px;position:relative}
.gtm-auth h3{font-family:var(--display);font-size:1.5rem;margin:0 0 4px;color:#f2f0e6;line-height:1.2}
.gtm-auth-sub{color:#a9ae9d;font-size:.86rem;margin-bottom:16px}
.gtm-auth-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;background:transparent;color:#a9ae9d;font-size:1.25rem;cursor:pointer}
.gtm-auth-close:hover{color:#fff}
.gtm-auth-tabs{display:flex;border-bottom:1px solid #363c2e;margin-bottom:18px}
.gtm-auth-tabs button{flex:1;border:0;background:transparent;color:#a9ae9d;padding:10px;font-weight:700;font-size:.9rem;cursor:pointer;border-bottom:2px solid transparent;font-family:var(--body)}
.gtm-auth-tabs button.on{color:#fff;border-bottom-color:#c8102e}
.gtm-auth label{display:block;font-size:.78rem;font-weight:700;color:#a9ae9d;margin:12px 0 4px;letter-spacing:.04em;text-transform:uppercase}
.gtm-auth input{width:100%;border:1px solid #363c2e;background:#14170f;color:#e9e7dc;padding:10px 12px;font-family:var(--body);font-size:.92rem}
.gtm-auth input:focus{outline:2px solid #c8102e;outline-offset:-1px}
.gtm-auth-err{color:#f06a7c;font-size:.82rem;margin-top:10px;min-height:1em}
.gtm-auth-submit{margin-top:14px;width:100%;border:0;background:#c8102e;color:#fff;padding:12px;font-weight:800;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-family:var(--body)}
.gtm-auth-submit:hover{background:#a30d25}
.gtm-auth-note{margin-top:12px;font-size:.72rem;color:#8d947f}
.gtm-user-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#5ecb7d;border:2px solid #14170f}
.gtm-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:290;min-width:220px;background:#1e2318;border:1px solid #363c2e;box-shadow:0 16px 40px rgba(0,0,0,.55);padding:8px}
.gtm-menu-name{padding:8px 10px;color:#f2f0e6;font-weight:700;font-size:.9rem;border-bottom:1px solid #2a2f23;margin-bottom:6px}
.gtm-menu-name small{display:block;color:#8d947f;font-weight:400;font-size:.74rem;margin-top:2px}
.gtm-menu button{width:100%;text-align:left;border:0;background:transparent;color:#e9e7dc;padding:9px 10px;font-size:.88rem;cursor:pointer;font-family:var(--body)}
.gtm-menu button:hover{background:#2a3122}
/* sell page gate */
.gtm-gate-host{position:relative}
.gtm-gate{position:absolute;inset:0;z-index:80;background:rgba(20,23,15,.9);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.gtm-gate-box{max-width:430px}
.gtm-gate-box h4{font-family:var(--display);font-size:1.45rem;color:#f2f0e6;margin:0 0 8px;line-height:1.25}
.gtm-gate-box p{color:#a9ae9d;font-size:.92rem;margin:0 0 16px}
.gtm-gate-box .gtm-auth-submit{width:auto;padding:12px 34px}

/* ---- currency toggle (GEL/USD) ---- */
.gtm-cur-toggle{display:inline-flex;border:1px solid #363c2e;background:#1e2318;margin-right:10px;vertical-align:middle}
.gtm-cur-toggle button{width:36px;height:34px;border:0;background:transparent;color:#a9ae9d;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit}
.gtm-cur-toggle button.active{background:#c8102e;color:#fff}
.gtm-cur-toggle button:not(.active):hover{color:#e9e7dc}

.gtm-policy li strong{color:#e8eadf;display:block;margin-bottom:2px}

</style>
<script>
/* GeoTactical Market enhancements
   Search & product list UX modeled on leading US tactical retailers (OpticsPlanet):
   1. Search autocomplete with product thumbnails and prices
   2. Grid / list view toggle on catalog results
   3. Price range filter in the catalog sidebar
   4. Product tile upgrades: brand line, stock status, shipping note, full-width CTA
   Implemented as a progressive-enhancement layer over the compiled React app. */
(function () {
  'use strict';

  /* ---------- currency: GEL-first site with a ₾/$ toggle ---------- */
  var USD_GEL = 2.68; // NBG-area market rate, update as needed
  var cur = (function () { try { return localStorage.getItem('gtm-cur') || 'GEL'; } catch (e) { return 'GEL'; } })();
  function fmtPrice(usd) {
    if (cur === 'GEL') return '₾' + Math.round(usd * USD_GEL).toLocaleString('en-US');
    var v = Math.round(usd * 100) / 100;
    return '$' + (v % 1 === 0 ? v.toLocaleString('en-US') : v.toLocaleString('en-US', { minimumFractionDigits: 2 }));
  }
  function repaintPrices() {
    var els = document.querySelectorAll('#root *');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.childElementCount !== 0) continue;
      var t = (el.textContent || '').trim();
      if (!el.dataset.gtmUsd) {
        var m = /^\$\s?([\d,]+(?:\.\d{1,2})?)$/.exec(t);
        if (!m) continue;
        el.dataset.gtmUsd = m[1].replace(/,/g, '');
      }
      var out = fmtPrice(parseFloat(el.dataset.gtmUsd));
      if (el.textContent !== out) el.textContent = out;
    }
    var lg = document.querySelector('.if-price legend');
    if (lg) {
      var want = 'ფასი (' + (cur === 'GEL' ? '₾' : '$') + ')';
      if (lg.textContent !== want) lg.textContent = want;
    }
  }
  function attachCurToggle() {
    if (document.querySelector('.gtm-cur-toggle')) return;
    var btn = [...document.querySelectorAll('header button, header a')].find(function (e) {
      return /პროფილი/.test(e.textContent) || /პროფილი/.test(e.getAttribute('aria-label') || '');
    });
    if (!btn || !btn.parentElement) return;
    var wrap = document.createElement('div');
    wrap.className = 'gtm-cur-toggle';
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', 'ვალუტის შეცვლა');
    wrap.innerHTML = '<button type="button" data-c="GEL">₾</button><button type="button" data-c="USD">$</button>';
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      cur = b.dataset.c;
      try { localStorage.setItem('gtm-cur', cur); } catch (err) {}
      syncCurButtons(); repaintPrices();
    });
    btn.parentElement.insertBefore(wrap, btn);
    syncCurButtons();
  }
  function syncCurButtons() {
    document.querySelectorAll('.gtm-cur-toggle button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.c === cur);
    });
  }

  /* ---------- store listings: merge API catalog into the storefront ---------- */
  var STORE_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
    '<rect width="512" height="512" fill="#1e2318"/>' +
    '<circle cx="256" cy="236" r="86" fill="none" stroke="#c8102e" stroke-width="14"/>' +
    '<line x1="256" y1="118" x2="256" y2="354" stroke="#c8102e" stroke-width="12"/>' +
    '<line x1="138" y1="236" x2="374" y2="236" stroke="#c8102e" stroke-width="12"/>' +
    '<text x="256" y="430" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#e9e7dc" text-anchor="middle" letter-spacing="6">GEOTACTICAL</text></svg>');
  function mergeStoreCache() {
    var cache; try { cache = JSON.parse(localStorage.getItem('gtm-store-cache') || '[]'); } catch (e) { cache = []; }
    if (!Array.isArray(cache) || !cache.length) return 0;
    var local; try { local = JSON.parse(localStorage.getItem('ironfield-listings') || '[]'); } catch (e) { local = []; }
    var have = {}; local.forEach(function (l) { have[String(l.id)] = 1; });
    var added = 0;
    cache.forEach(function (l) {
      var id = 'api-' + l.id;
      if (have[id]) return;
      var usd = (l.cur === 'USD') ? +l.price : (+l.price / USD_GEL);
      local.push({
        id: id, name: l.name, category: l.cat || 'სასროლეთის აღჭურვილობა', condition: l.cond || 'ახალი',
        price: Math.round(usd * 100) / 100, image: STORE_IMG, badge: 'მაღაზიის პროდუქტი',
        rating: 0, reviews: 0, location: 'თბილისი', seller: l.seller || 'GeoTactical Market-ის მაღაზია',
        verified: true, regulated: !!l.regulated, description: l.desc || ''
      });
      added++;
    });
    if (added) { try { window._gtmOrigSetItem ? window._gtmOrigSetItem('ironfield-listings', JSON.stringify(local)) : localStorage.setItem('ironfield-listings', JSON.stringify(local)); } catch (e) {} }
    return added;
  }
  mergeStoreCache(); // synchronous, before the app mounts

  var CATEGORIES = [
    'ოპტიკა', 'ჩანთები და შენახვა', 'სასროლეთის აღჭურვილობა',
    'ტანსაცმელი', 'პირველადი დახმარება', 'ცეცხლსასროლი იარაღი'
  ];
  var POPULAR = ['ზუსტი ოპტიკა', 'სასროლეთის ჩანთები', 'სმენის დაცვა'];
  var PRODUCTS = [
    'Apex 5–25×56 ზუსტი ოპტიკური სამიზნე',
    'Ridge 32-ლიტრიანი საველე ზურგჩანთა',
    'Defender Pro ელექტრონული სმენის დამცავი',
    'Scout 10×42 საველე ბინოკლი',
    'ყველა ამინდის საველე ქურთუკი',
    'კომპაქტური ტრავმის ნაკრები — საველე',
    'Apex ზუსტი ოპტიკა — მეორადი',
    'Ridge საველე ზურგჩანთა — ზეთისხილისფერი',
    'Bolt-Action სპორტული შაშხანა — .308'
  ];
  var harvest = {}; // product name -> { img, price } gathered from rendered cards

  var SEARCH_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
  var GRID_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>';
  var LIST_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';
  var CHECK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  var state = {
    view: (function () { try { return localStorage.getItem('if-view') || 'grid'; } catch (e) { return 'grid'; } })(),
    priceMin: null,
    priceMax: null
  };
  var applying = false;

  function setNativeValue(input, value) {
    var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
    setter.call(input, value);
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function hi(text, q) {
    if (!q) return esc(text);
    var j = text.toLowerCase().indexOf(q);
    if (j === -1) return esc(text);
    return esc(text.slice(0, j)) + '<b>' + esc(text.slice(j, j + q.length)) + '</b>' + esc(text.slice(j + q.length));
  }

  /* ---------- harvest product data from rendered cards ---------- */
  function harvestCards() {
    document.querySelectorAll('.product-card').forEach(function (card) {
      var name = card.querySelector('h3') && card.querySelector('h3').textContent.trim();
      if (!name) return;
      var img = card.querySelector('.product-image img');
      var priceEl = card.querySelector('.product-bottom strong');
      var usd = null;
      if (priceEl) {
        if (priceEl.dataset.gtmUsd) usd = parseFloat(priceEl.dataset.gtmUsd);
        else {
          var n = parseFloat((priceEl.textContent || '').replace(/[^0-9.]/g, ''));
          if (!isNaN(n)) usd = (priceEl.textContent || '').indexOf('₾') > -1 ? n / USD_GEL : n;
        }
      }
      if (!harvest[name]) harvest[name] = { img: img ? img.getAttribute('src') : null, usd: usd };
      else { if (usd != null) harvest[name].usd = usd; if (!harvest[name].img && img) harvest[name].img = img.getAttribute('src'); }
    });
  }

  /* ---------- 1. search autocomplete ---------- */
  function attachAutocomplete(form) {
    if (form.dataset.ifAc) return;
    var input = form.querySelector('input');
    var submit = form.querySelector('button[type="submit"], button:not([type])') || form.querySelector('button');
    if (!input) return;
    form.dataset.ifAc = '1';
    form.classList.add('if-ac-host');
    input.setAttribute('autocomplete', 'off');

    var panel = document.createElement('div');
    panel.className = 'if-ac';
    panel.hidden = true;
    form.appendChild(panel);
    var sel = -1;

    function choose(text) {
      hide();
      setNativeValue(input, text);
      if (submit) {
        setTimeout(function () { submit.click(); }, 0);
      } else {
        form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      }
    }

    function hide() { panel.hidden = true; sel = -1; }

    function itemHtml(text, q, extraHtml, thumbHtml) {
      return '<button type="button" class="if-ac-item" data-t="' + esc(text) + '">' +
        (thumbHtml || SEARCH_SVG) + '<span>' + hi(text, q) + '</span>' + (extraHtml || '') + '</button>';
    }

    function render() {
      var q = input.value.trim().toLowerCase();
      var html = '';
      var cats = CATEGORIES.filter(function (c) { return !q || c.toLowerCase().indexOf(q) !== -1; }).slice(0, 3);
      var prods = PRODUCTS.filter(function (p) { return !q || p.toLowerCase().indexOf(q) !== -1; }).slice(0, 6);
      if (!q) {
        html += '<div class="if-ac-head">პოპულარული ძიებები</div>';
        html += POPULAR.map(function (p) { return itemHtml(p, ''); }).join('');
      }
      if (cats.length) {
        html += '<div class="if-ac-head">კატეგორიები</div>';
        html += cats.map(function (c) {
          return itemHtml(c, q, '<span class="if-ac-tag">კატეგორია</span>');
        }).join('');
      }
      if (prods.length) {
        html += '<div class="if-ac-head">პროდუქტები</div>';
        html += prods.map(function (p) {
          var h = harvest[p] || {};
          var thumb = h.img ? '<img class="if-ac-thumb" alt="" src="' + h.img + '">' : null;
          var price = (h.usd != null) ? '<span class="if-ac-price">' + esc(fmtPrice(h.usd)) + '</span>' : '';
          return itemHtml(p, q, price, thumb);
        }).join('');
      }
      if (!html) { hide(); return; }
      panel.innerHTML = html;
      panel.hidden = false;
      sel = -1;
    }

    input.addEventListener('input', render);
    input.addEventListener('focus', render);
    input.addEventListener('keydown', function (e) {
      if (panel.hidden) return;
      var items = panel.querySelectorAll('.if-ac-item');
      if (!items.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        sel = e.key === 'ArrowDown' ? (sel + 1) % items.length : (sel - 1 + items.length) % items.length;
        items.forEach(function (el, i) { el.classList.toggle('sel', i === sel); });
        items[sel].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' && sel >= 0) {
        e.preventDefault();
        choose(items[sel].dataset.t);
      } else if (e.key === 'Escape') {
        hide();
      }
    });
    panel.addEventListener('mousedown', function (e) {
      var btn = e.target.closest('.if-ac-item');
      if (btn) { e.preventDefault(); choose(btn.dataset.t); }
    });
    document.addEventListener('click', function (e) { if (!form.contains(e.target)) hide(); });
  }

  /* ---------- 2. grid / list view toggle ---------- */
  function attachViewToggle(toolbar) {
    if (toolbar.querySelector('.if-view-toggle')) return;
    var wrap = document.createElement('div');
    wrap.className = 'if-view-toggle';
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', 'ხედის შეცვლა');
    wrap.innerHTML =
      '<button type="button" data-v="grid" aria-label="ბადის ხედი" title="ბადის ხედი">' + GRID_SVG + '</button>' +
      '<button type="button" data-v="list" aria-label="სიის ხედი" title="სიის ხედი">' + LIST_SVG + '</button>';
    wrap.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      state.view = btn.dataset.v;
      try { localStorage.setItem('if-view', state.view); } catch (err) {}
      applyAll();
    });
    toolbar.insertBefore(wrap, toolbar.firstChild);
  }

  function syncView() {
    var grid = document.querySelector('.product-grid');
    if (grid) grid.classList.toggle('if-list', state.view === 'list');
    document.querySelectorAll('.if-view-toggle button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.v === state.view);
    });
  }

  /* ---------- 3. price range filter ---------- */
  function attachPriceFilter(aside) {
    if (aside.querySelector('.if-price')) return;
    var group = document.createElement('div');
    group.className = 'filter-group if-price';
    group.innerHTML =
      '<fieldset><legend>ფასი (USD)</legend>' +
      '<div class="if-price-row">' +
      '<input type="number" min="0" inputmode="numeric" placeholder="დან" aria-label="მინიმალური ფასი" class="if-price-min">' +
      '<span>—</span>' +
      '<input type="number" min="0" inputmode="numeric" placeholder="მდე" aria-label="მაქსიმალური ფასი" class="if-price-max">' +
      '</div>' +
      '<button type="button" class="if-price-apply">გამოყენება</button>' +
      '<button type="button" class="if-price-clear" hidden>ფასის ფილტრის მოხსნა</button>' +
      '<div class="if-price-note" hidden></div>' +
      '</fieldset>';
    var groups = aside.querySelectorAll('.filter-group');
    var last = groups.length ? groups[groups.length - 1] : null;
    if (last && last.nextSibling) aside.insertBefore(group, last.nextSibling);
    else aside.appendChild(group);

    function readAndApply() {
      var min = parseFloat(group.querySelector('.if-price-min').value);
      var max = parseFloat(group.querySelector('.if-price-max').value);
      state.priceMin = isNaN(min) ? null : min;
      state.priceMax = isNaN(max) ? null : max;
      applyAll();
    }
    group.querySelector('.if-price-apply').addEventListener('click', readAndApply);
    group.querySelectorAll('input').forEach(function (inp) {
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); readAndApply(); } });
    });
    group.querySelector('.if-price-clear').addEventListener('click', function () {
      group.querySelector('.if-price-min').value = '';
      group.querySelector('.if-price-max').value = '';
      state.priceMin = state.priceMax = null;
      applyAll();
    });
  }

  function parsePrice(card) {
    var el = card.querySelector('.product-bottom strong');
    if (!el) return null;
    var n = parseFloat(el.textContent.replace(/[^0-9.]/g, ''));
    return isNaN(n) ? null : n;
  }

  function syncPrice() {
    var grid = document.querySelector('.product-grid');
    var group = document.querySelector('.if-price');
    var active = state.priceMin !== null || state.priceMax !== null;
    if (group) {
      group.querySelector('.if-price-clear').hidden = !active;
      group.querySelector('.if-price-note').hidden = true;
    }
    if (!grid) return;
    var shown = 0, total = 0;
    grid.querySelectorAll('.product-card').forEach(function (card) {
      total++;
      var p = parsePrice(card);
      var ok = !active || p === null ||
        ((state.priceMin === null || p >= state.priceMin) && (state.priceMax === null || p <= state.priceMax));
      card.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });
    var empty = grid.parentElement.querySelector('.if-empty');
    if (active && shown === 0) {
      if (!empty) {
        empty = document.createElement('p');
        empty.className = 'if-empty';
        empty.textContent = 'ამ ფასის დიაპაზონში ნივთი ვერ მოიძებნა — შეცვალეთ ფილტრი.';
        grid.parentElement.appendChild(empty);
      }
    } else if (empty) {
      empty.remove();
    }
    if (group && active) {
      var note = group.querySelector('.if-price-note');
      note.textContent = 'ნაჩვენებია ' + shown + ' / ' + total + ' ნივთი';
      note.hidden = false;
    }
  }

  /* ---------- 4. product tile upgrades (brand, stock, shipping, CTA label) ---------- */
  function decorateCards() {
    document.querySelectorAll('.product-card:not([data-if-deco])').forEach(function (card) {
      card.setAttribute('data-if-deco', '1');
      var info = card.querySelector('.product-info');
      var h3 = card.querySelector('h3');
      if (info && h3) {
        var first = (h3.textContent.trim().split(/\s+/)[0] || '').replace(/[^\w.-]/g, '');
        if (/^[A-Za-z][\w.-]{2,}$/.test(first)) {
          var brand = document.createElement('div');
          brand.className = 'if-brand';
          brand.textContent = first;
          info.insertBefore(brand, h3);
        }
      }
      var bottom = card.querySelector('.product-bottom');
      if (bottom) {
        var stock = document.createElement('div');
        stock.className = 'if-stock';
        stock.innerHTML = CHECK_SVG + ' მარაგშია';
        var ship = document.createElement('div');
        var kick = (card.querySelector('.product-kicker') || { textContent: '' }).textContent;
        var cCat = (kick.split('·')[0] || '').trim();
        var cCond = (kick.split('·')[1] || '').trim();
        var cName = (card.querySelector('h3') || { textContent: '' }).textContent.trim();
        var cSeller = SELLERS[cName];
        if (card.querySelector('.product-image.regulated') || /იარაღ|საბრძოლო/.test(cCat)) {
          ship.className = 'if-ship if-ship-none';
          ship.textContent = 'მიწოდება არ ხდება — ადგილზე გადაცემა';
        } else if (cSeller && cSeller.indexOf('GeoTactical Market') !== 0) {
          ship.className = 'if-ship if-ship-seller';
          ship.textContent = 'მიწოდება — გამყიდველის პასუხისმგებლობით';
        } else if (cCond && cCond !== 'ახალი') {
          ship.className = 'if-ship if-ship-seller';
          ship.textContent = 'მიწოდება — შეთანხმებით';
        } else {
          ship.className = 'if-ship';
          ship.textContent = 'უფასო მიწოდება თბილისში';
        }
        var priceEl = bottom.querySelector('strong');
        if (priceEl && priceEl.nextSibling) {
          bottom.insertBefore(stock, priceEl.nextSibling);
        } else {
          bottom.appendChild(stock);
        }
        stock.after(ship);
      }
      var cta = card.querySelector('.quick-add');
      if (cta && !cta.querySelector('.if-cta-label') && cta.textContent.trim() === '') {
        var label = document.createElement('span');
        label.className = 'if-cta-label';
        label.textContent = 'კალათაში დამატება';
        cta.appendChild(label);
      }
    });
  }


  var SELLERS = {};
  function refreshSellers() {
    SELLERS = {};
    try {
      (JSON.parse(localStorage.getItem('ironfield-listings') || '[]') || []).forEach(function (l) {
        if (l && l.name) SELLERS[l.name] = l.seller || '';
      });
    } catch (e) {}
  }

  /* delivery policy: no shipping for firearms/ammo; seller-arranged for user
     listings and used items; free shipping only in Tbilisi for new store stock */
  function fixModalDelivery() {
    var modal = document.querySelector('.product-modal');
    if (!modal) return;
    var span = modal.querySelector('.delivery-row span');
    if (!span || span.getAttribute('data-gtm-ship')) return;
    span.setAttribute('data-gtm-ship', '1');
    var kick = (modal.querySelector('.product-kicker') || { textContent: '' }).textContent;
    var cond = (kick.split('·')[1] || '').trim();
    var sellerEl = modal.querySelector('.seller-box strong');
    var seller = sellerEl ? sellerEl.textContent.trim() : '';
    if (seller && seller.indexOf('GeoTactical Market') !== 0) {
      span.innerHTML = '<strong>მიწოდებას უზრუნველყოფს გამყიდველი</strong> · პლატფორმა მომხმარებელთა შორის მიწოდებაზე პასუხისმგებელი არ არის';
    } else if (cond && cond !== 'ახალი') {
      span.innerHTML = '<strong>მიწოდება შეთანხმებით</strong> · დაუკავშირდით გამყიდველს';
    } else {
      span.innerHTML = '<strong>უფასო მიწოდება თბილისში</strong> · რეგიონებში ტარიფი შეკვეთისას';
    }
  }

  function annotateCatCounts() {
    var groups = document.querySelectorAll('aside.filters .filter-group');
    if (!groups.length) return;
    var catGroup = null, condGroup = null;
    groups.forEach(function (g) {
      var t = g.querySelector('.filter-title');
      if (!t) return;
      var txt = t.textContent.trim();
      if (txt === 'კატეგორია') catGroup = g;
      if (txt === 'მდგომარეობა') condGroup = g;
    });
    if (!catGroup) return;
    var mode = document.querySelector('.marketplace-hero') ? 'mk' : 'shop';
    var key = 'gtm-cat-counts-' + mode;
    var rows = [...catGroup.querySelectorAll('.radio-row')];
    if (!rows.length) return;
    function rowName(row) {
      var c = row.cloneNode(true);
      var b = c.querySelector('.if-count');
      if (b) b.remove();
      return c.textContent.trim();
    }
    // counts are trustworthy only when nothing filters the grid
    var allSel = (rows[0].querySelector('input') || {}).checked;
    var condAll = !condGroup || ((condGroup.querySelector('.radio-row input') || {}).checked);
    var tb = document.querySelector('.catalog-toolbar > div');
    var searching = tb && tb.querySelector('span');
    if (allSel && condAll && !searching) {
      var counts = {}, total = 0;
      document.querySelectorAll('.product-card .product-kicker').forEach(function (k) {
        var cat = k.textContent.split('·')[0].trim();
        if (!cat) return;
        counts[cat] = (counts[cat] || 0) + 1;
        total++;
      });
      if (total) {
        counts[rowName(rows[0])] = total;
        try { localStorage.setItem(key, JSON.stringify(counts)); } catch (e) {}
      }
    }
    var saved;
    try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { saved = {}; }
    rows.forEach(function (row) {
      var n = saved[rowName(row)];
      var chip = row.querySelector('.if-count');
      if (n == null) { if (chip) chip.remove(); return; }
      if (!chip) {
        chip = document.createElement('span');
        chip.className = 'if-count';
        row.appendChild(chip);
      }
      if (chip.textContent !== String(n)) chip.textContent = n;
    });
  }

  function attachShippingPolicy() {
    [...document.querySelectorAll('footer button')].forEach(function (b) {
      if (b.textContent.trim() !== 'მიწოდება და დაბრუნება' || b.getAttribute('data-gtm-pol')) return;
      b.setAttribute('data-gtm-pol', '1');
      b.addEventListener('click', function () {
        if (document.querySelector('.gtm-policy-backdrop')) return;
        var w = document.createElement('div');
        w.className = 'gtm-auth-backdrop gtm-policy-backdrop';
        w.innerHTML =
          '<div class="gtm-auth gtm-policy" role="dialog" aria-modal="true">' +
          '<button type="button" class="gtm-auth-close" aria-label="დახურვა">✕</button>' +
          '<h3>მიწოდება და დაბრუნება</h3>' +
          '<ul>' +
          '<li><strong>ცეცხლსასროლი იარაღი და საბრძოლო მასალა</strong> — მიწოდება არ ხდება. გადაცემა მხოლოდ ადგილზე, კანონით დადგენილი წესით.</li>' +
          '<li><strong>მაღაზიის ახალი პროდუქცია</strong> (აღჭურვილობა, ოპტიკა, ტანსაცმელი და სხვ.) — უფასო მიწოდება თბილისში; რეგიონებში ტარიფი გამოითვლება შეკვეთისას.</li>' +
          '<li><strong>მომხმარებლების განცხადებები</strong> — მიწოდებას აწყობს გამყიდველი. პლატფორმა მომხმარებელთა შორის გარიგების მიწოდებაზე პასუხისმგებელი არ არის.</li>' +
          '<li><strong>დაბრუნება</strong> — მაღაზიის ახალ პროდუქციაზე 14 დღეში, დაუზიანებელი შეფუთვით.</li>' +
          '</ul></div>';
        w.querySelector('.gtm-auth-close').addEventListener('click', function () { w.remove(); });
        w.addEventListener('click', function (e) { if (e.target === w) w.remove(); });
        document.body.appendChild(w);
      });
    });
  }

  /* ---------- backend bridge: uses /api/gtm when a database is attached ---------- */
  var apiMode = false;
  function apiToken() { try { return localStorage.getItem('gtm-token') || ''; } catch (e) { return ''; } }
  function apiProfile() { try { return JSON.parse(localStorage.getItem('gtm-profile') || 'null'); } catch (e) { return null; } }
  function apiCall(action, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (apiToken()) opts.headers.Authorization = 'Bearer ' + apiToken();
    return fetch('/api/gtm?a=' + action, opts).then(function (r) {
      return r.json().then(function (b) { return { code: r.status, body: b }; });
    });
  }
  fetch('/api/gtm?a=health').then(function (r) { return r.json(); }).then(function (h) {
    if (h && h.connected) {
      apiMode = true; applyAll();
      fetch('/api/gtm?a=listings').then(function (r2) { return r2.json(); }).then(function (list) {
        if (!Array.isArray(list)) return;
        try { localStorage.setItem('gtm-store-cache', JSON.stringify(list)); } catch (e) {}
        var added = mergeStoreCache();
        if (added > 0 && !sessionStorage.getItem('gtm-store-synced')) {
          sessionStorage.setItem('gtm-store-synced', '1');
          location.reload();
        }
      }).catch(function (e) {});
    }
  }).catch(function (e) {});

  var _origSetItem = localStorage.setItem.bind(localStorage);
  window._gtmOrigSetItem = _origSetItem;
  try {
    localStorage.setItem = function (k, v) {
      _origSetItem(k, v);
      if (k === 'ironfield-listings') syncListings(v);
    };
  } catch (e) {}
  function syncListings(v) {
    if (!apiMode || !apiToken()) return;
    var arr; try { arr = JSON.parse(v) || []; } catch (e) { return; }
    if (!Array.isArray(arr)) return;
    var synced; try { synced = JSON.parse(localStorage.getItem('gtm-synced') || '[]'); } catch (e) { synced = []; }
    arr.forEach(function (l) {
      var key = String(l.id || l.name || '');
      if (!key || key.indexOf('api-') === 0 || synced.indexOf(key) > -1) return;
      synced.push(key);
      apiCall('listings', { method: 'POST', body: JSON.stringify({
        name: l.name || l.title, price: l.price, cat: l.category, cond: l.condition, regulated: !!l.regulated, cur: 'USD'
      }) }).catch(function (e) {});
    });
    _origSetItem('gtm-synced', JSON.stringify(synced.slice(-100)));
  }

  /* ---------- 5. accounts: register / login / sell gating (client-side demo) ---------- */
  function users() { try { return JSON.parse(localStorage.getItem('gtm-users') || '{}'); } catch (e) { return {}; } }
  function saveUsers(u) { try { localStorage.setItem('gtm-users', JSON.stringify(u)); } catch (e) {} }
  function session() {
    var p = apiToken() && apiProfile();
    if (p && p.email) return p;
    try {
      var em = localStorage.getItem('gtm-session');
      if (!em) return null;
      var u = users()[em];
      return u ? { email: em, name: u.name } : null;
    } catch (e) { return null; }
  }
  function setSession(email) {
    try {
      if (!email) {
        if (apiToken()) apiCall('logout', { method: 'POST' }).catch(function (e) {});
        localStorage.removeItem('gtm-token'); localStorage.removeItem('gtm-profile');
        localStorage.removeItem('gtm-session');
      } else {
        localStorage.setItem('gtm-session', email);
      }
    } catch (e) {}
  }

  function openAuth(mode) {
    closeAuth(); closeMenu();
    var wrap = document.createElement('div');
    wrap.className = 'gtm-auth-backdrop';
    wrap.innerHTML =
      '<div class="gtm-auth" role="dialog" aria-modal="true">' +
      '<button type="button" class="gtm-auth-close" aria-label="დახურვა">✕</button>' +
      '<h3>GEOTACTICAL MARKET</h3>' +
      '<div class="gtm-auth-sub">ანგარიშით შეძლებთ განცხადებების დამატებას და შენახულ ნივთებზე წვდომას.</div>' +
      '<div class="gtm-auth-tabs">' +
      '<button type="button" data-m="login">შესვლა</button>' +
      '<button type="button" data-m="register">რეგისტრაცია</button>' +
      '</div>' +
      '<form novalidate>' +
      '<div class="gtm-f-name"><label>სახელი და გვარი</label><input name="name" type="text" autocomplete="name"></div>' +
      '<label>ელფოსტა</label><input name="email" type="email" autocomplete="email">' +
      '<div class="gtm-f-phone"><label>ტელეფონი (არასავალდებულო)</label><input name="phone" type="tel" autocomplete="tel"></div>' +
      '<label>პაროლი</label><input name="pass" type="password" autocomplete="current-password">' +
      '<div class="gtm-auth-err"></div>' +
      '<button type="submit" class="gtm-auth-submit">შესვლა</button>' +
      '</form>' +
      '<div class="gtm-auth-note">დემო-ვერსია: ანგარიში ინახება მხოლოდ თქვენს ბრაუზერში.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var form = wrap.querySelector('form');
    var err = wrap.querySelector('.gtm-auth-err');
    var cur = mode || 'login';
    function setMode(m2) {
      cur = m2;
      wrap.querySelectorAll('.gtm-auth-tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === m2); });
      wrap.querySelector('.gtm-f-name').style.display = m2 === 'register' ? '' : 'none';
      wrap.querySelector('.gtm-f-phone').style.display = m2 === 'register' ? '' : 'none';
      wrap.querySelector('.gtm-auth-submit').textContent = m2 === 'register' ? 'ანგარიშის შექმნა' : 'შესვლა';
      err.textContent = '';
    }
    setMode(cur);
    wrap.querySelector('.gtm-auth-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (b) setMode(b.dataset.m);
    });
    wrap.querySelector('.gtm-auth-close').addEventListener('click', closeAuth);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) closeAuth(); });
    form.addEventListener('submit', function (e) {
      e.preventDefault(); e.stopPropagation();
      var email = form.email.value.trim().toLowerCase();
      var pass = form.pass.value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'შეიყვანეთ სწორი ელფოსტა.'; return; }
      if (pass.length < 6) { err.textContent = 'პაროლი უნდა იყოს მინიმუმ 6 სიმბოლო.'; return; }
      if (apiMode) {
        var payload = cur === 'register'
          ? { name: form.name.value.trim(), email: email, pass: pass, phone: form.phone.value.trim() }
          : { email: email, pass: pass };
        if (cur === 'register' && payload.name.length < 2) { err.textContent = 'შეიყვანეთ სახელი.'; return; }
        err.textContent = '...';
        apiCall(cur === 'register' ? 'register' : 'login', { method: 'POST', body: JSON.stringify(payload) })
          .then(function (r) {
            if (r.code === 200 && r.body.token) {
              try {
                localStorage.setItem('gtm-token', r.body.token);
                localStorage.setItem('gtm-profile', JSON.stringify({ name: r.body.name, email: r.body.email }));
              } catch (e2) {}
              closeAuth(); applyAll();
            } else {
              err.textContent = {
                'exists': 'ეს ელფოსტა უკვე რეგისტრირებულია — სცადეთ შესვლა.',
                'bad-credentials': 'ელფოსტა ან პაროლი არასწორია.',
                'blocked': 'ეს ანგარიში დაბლოკილია.',
                'short-pass': 'პაროლი უნდა იყოს მინიმუმ 6 სიმბოლო.',
                'bad-name': 'შეიყვანეთ სახელი.'
              }[r.body && r.body.error] || 'შეცდომა — სცადეთ თავიდან.';
            }
          })
          .catch(function () { err.textContent = 'კავშირის შეცდომა — სცადეთ თავიდან.'; });
        return;
      }
      var db = users();
      if (cur === 'register') {
        var name = form.name.value.trim();
        if (name.length < 2) { err.textContent = 'შეიყვანეთ სახელი.'; return; }
        if (db[email]) { err.textContent = 'ეს ელფოსტა უკვე რეგისტრირებულია — სცადეთ შესვლა.'; return; }
        db[email] = { name: name, phone: form.phone.value.trim(), p: btoa(unescape(encodeURIComponent(pass))) };
        saveUsers(db);
      } else {
        var u = db[email];
        if (!u || u.p !== btoa(unescape(encodeURIComponent(pass)))) { err.textContent = 'ელფოსტა ან პაროლი არასწორია.'; return; }
      }
      setSession(email);
      closeAuth();
      applyAll();
    }, true);
    setTimeout(function () { (cur === 'register' ? form.name : form.email).focus(); }, 50);
  }
  function closeAuth() { var el = document.querySelector('.gtm-auth-backdrop'); if (el) el.remove(); }
  function closeMenu() { var el = document.querySelector('.gtm-menu'); if (el) el.remove(); }

  function profileButton() {
    return [...document.querySelectorAll('header button, header a')].find(function (e) {
      return /პროფილი/.test(e.textContent) || /პროფილი/.test(e.getAttribute('aria-label') || '');
    });
  }

  function toggleMenu(btn) {
    if (document.querySelector('.gtm-menu')) { closeMenu(); return; }
    var s = session(); if (!s) return;
    var host = btn.parentElement;
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    var menu = document.createElement('div');
    menu.className = 'gtm-menu';
    menu.innerHTML =
      '<div class="gtm-menu-name">' + s.name.replace(/[<>&]/g, '') + '<small>' + s.email.replace(/[<>&]/g, '') + '</small></div>' +
      '<button type="button" data-act="sell">ჩემი განცხადებები / გაყიდვა</button>' +
      '<button type="button" data-act="logout">გასვლა</button>';
    menu.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'logout') { setSession(null); closeMenu(); applyAll(); }
      if (b.dataset.act === 'sell') { closeMenu(); location.hash = '#/sell'; }
    });
    host.appendChild(menu);
    setTimeout(function () {
      document.addEventListener('click', function once(e) {
        if (!menu.contains(e.target) && e.target !== btn) { closeMenu(); document.removeEventListener('click', once, true); }
      }, true);
    }, 0);
  }

  function syncAuth() {
    var btn = profileButton();
    if (btn && !btn.dataset.gtmAuth) {
      btn.dataset.gtmAuth = '1';
      btn.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (session()) toggleMenu(btn); else openAuth('login');
      }, true);
    }
    if (btn) {
      var logged = !!session();
      if (getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
      var dot = btn.querySelector('.gtm-user-dot');
      if (logged && !dot) { dot = document.createElement('span'); dot.className = 'gtm-user-dot'; btn.appendChild(dot); }
      if (!logged && dot) dot.remove();
    }
    // gate the sell page for unregistered users
    var onSell = location.hash.indexOf('#/sell') === 0;
    var gate = document.querySelector('.gtm-gate');
    if (onSell && !session()) {
      var form = [...document.querySelectorAll('main form')].find(function (f) { return !/search/.test(f.className); });
      var host = form ? (form.closest('section') || form.parentElement) : null;
      if (host && !gate) {
        host.classList.add('gtm-gate-host');
        gate = document.createElement('div');
        gate.className = 'gtm-gate';
        gate.innerHTML =
          '<div class="gtm-gate-box">' +
          '<h4>განცხადების დასამატებლად საჭიროა ანგარიში</h4>' +
          '<p>დაურეგისტრირებელ მომხმარებლებს გაყიდვა არ შეუძლიათ. შექმენით ანგარიში ან შედით არსებულით — ერთ წუთში.</p>' +
          '<button type="button" class="gtm-auth-submit">რეგისტრაცია / შესვლა</button>' +
          '</div>';
        gate.querySelector('button').addEventListener('click', function () { openAuth('register'); });
        host.appendChild(gate);
      }
    } else if (gate) {
      gate.remove();
    }
  }
  window.addEventListener('hashchange', function () { setTimeout(applyAll, 120); });

  /* ---------- orchestration ---------- */
  function applyAll() {
    if (applying) return;
    applying = true;
    try {
      document.querySelectorAll('form.header-search, form.mobile-search, form[class*="search"]').forEach(attachAutocomplete);
      var toolbar = document.querySelector('.toolbar-actions');
      if (toolbar) attachViewToggle(toolbar);
      var aside = document.querySelector('aside.filters');
      if (aside) attachPriceFilter(aside);
      harvestCards();
      refreshSellers();
      decorateCards();
      fixModalDelivery();
      annotateCatCounts();
      attachShippingPolicy();
      syncView();
      syncPrice();
      syncAuth();
      attachCurToggle();
      repaintPrices();
    } finally {
      applying = false;
    }
  }

  var scheduled = false;
  function schedule() {
    if (scheduled || applying) return;
    scheduled = true;
    requestAnimationFrame(function () {
      scheduled = false;
      if (!applying) applyAll();
    });
  }

  function start() {
    var root = document.getElementById('root');
    if (!root) return;
    new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        var t = muts[i].target;
        if (t.closest && (t.closest('.if-ac') || t.closest('.if-view-toggle') || t.closest('.if-price') || t.closest('.gtm-auth-backdrop') || t.closest('.gtm-menu') || t.closest('.gtm-gate') || t.closest('.gtm-cur-toggle') || t.closest('.if-count') || t.closest('.gtm-policy-backdrop'))) continue;
        schedule();
        return;
      }
    }).observe(root, { childList: true, subtree: true });
    applyAll();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
